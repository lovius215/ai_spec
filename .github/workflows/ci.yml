name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    name: Check & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Verify CLI help
        run: node bin/sa-spec.js help

      - name: Verify CLI doctor
        run: node bin/sa-spec.js doctor

      - name: Verify CLI upgrade dry-run
        run: node bin/sa-spec.js upgrade --dry-run
